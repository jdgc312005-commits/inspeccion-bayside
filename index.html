<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D45500">
<title>Inspección Bayside Fase 1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: encabezado fijo con avance general, navegación torre/piso, tarjetas por unidad que se expanden, barra inferior con dos pestañas (Recorrido / Resumen). */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#FFF5EC; --fg:#231A14; --muted:#74655A; --line:#EBD9C8;
  --accent:#D45500; --accent-fg:#FFFFFF;
  --ok:#1B7F3B; --ok-bg:#DDF3E3; --rep:#C62828; --rep-bg:#FDE2E2;
  --prog:#B34700; --prog-bg:#FFE7D3; --pend:#6B7280; --pend-bg:#ECEDEF;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14100D; --surface:#1F1A16; --surface2:#2A231E; --fg:#F6EEE7; --muted:#A99B8F; --line:#3B322B;
    --accent:#FF8A2B; --accent-fg:#1A0E04;
    --ok:#4ADE80; --ok-bg:#12341F; --rep:#FF6B6B; --rep-bg:#44181A;
    --prog:#FFA05A; --prog-bg:#3F2512; --pend:#A3A3AB; --pend-bg:#2B2B30;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14100D; --surface:#1F1A16; --surface2:#2A231E; --fg:#F6EEE7; --muted:#A99B8F; --line:#3B322B;
  --accent:#FF8A2B; --accent-fg:#1A0E04;
  --ok:#4ADE80; --ok-bg:#12341F; --rep:#FF6B6B; --rep-bg:#44181A;
  --prog:#FFA05A; --prog-bg:#3F2512; --pend:#A3A3AB; --pend-bg:#2B2B30;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0 104px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin-inline:auto;min-width:0}

/* Encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:12px 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin-inline:auto;display:grid;gap:8px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{min-width:0}
.logo{height:52px;width:auto;max-width:140px;object-fit:contain;flex:none}
.theme{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--accent)}
.theme svg{width:22px;height:22px}
h1{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.saving i{background:var(--prog)}
.sync.local i,.sync.connecting i{background:var(--pend)}
.sync.error i{background:var(--rep)}
.overall{display:grid;gap:5px}
.overall-t{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:4px 12px;flex-wrap:wrap}
.overall-t b{color:var(--fg);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--pend-bg);overflow:hidden;display:flex}
.meter u{display:block;height:100%;text-decoration:none}
.meter .m-ok{background:var(--ok)} .meter .m-rep{background:var(--rep)} .meter .m-fix{background:var(--prog)}
.notice{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--rep-bg);color:var(--rep);font-size:13px}

main{padding-top:14px;display:grid;gap:16px}

/* Navegación */
.nav-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.towers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tw{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 6px 8px;display:grid;gap:3px;text-align:center;min-width:0}
.tw b{font-family:var(--f-display);font-size:17px;line-height:1;font-weight:700;text-transform:uppercase}
.tw small{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.tw .bar{height:4px;border-radius:9px;background:var(--pend-bg);overflow:hidden;margin-top:3px}
.tw .bar u{display:block;height:100%;background:var(--ok);text-decoration:none}
.tw.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tw.on small{color:inherit;opacity:.85}
.tw.on .bar{background:rgba(255,255,255,.3)} .tw.on .bar u{background:var(--accent-fg)}
.floors{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.fl{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;display:grid;gap:1px;text-align:center;min-width:0}
.fl b{font-family:var(--f-display);font-size:22px;line-height:1;font-weight:700}
.fl small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fl.full small{color:var(--ok);font-weight:600}
.fl.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.fl.on small{color:inherit;opacity:.9}
.ph{font-size:10px;letter-spacing:.08em;text-transform:uppercase}

/* Listas */
.group-t{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 8px;display:flex;align-items:center;gap:10px}
.group-t::after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:grid;gap:10px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:12px;scroll-margin-top:88px;overflow:hidden;border-left-width:5px}
.unit.st-ok{border-left-color:var(--ok)} .unit.st-rep{border-left-color:var(--rep)} .unit.st-fix{border-left-color:var(--prog)} .unit.st-pend{border-left-color:var(--pend)}
.unit-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px 12px 12px 12px;text-align:left;min-height:64px}
.code{font-family:var(--f-mono);font-weight:600;font-size:22px;letter-spacing:.01em;min-width:4.2ch}
.meta{display:grid;gap:1px;min-width:0;flex:1}
.meta-1{font-size:13px;color:var(--fg);overflow-wrap:anywhere}
.meta-2{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;background:var(--pend-bg);color:var(--pend)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.rep{background:var(--rep-bg);color:var(--rep)} .pill.fix{background:var(--prog-bg);color:var(--prog)}
.chev{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .15s}
.unit.open .chev{transform:rotate(180deg)}
.body{border-top:1px solid var(--line);padding:6px 12px 14px;display:grid;gap:2px;background:var(--surface)}
.part{padding:12px 0;display:grid;gap:10px;border-bottom:1px dashed var(--line)}
.part:last-of-type{border-bottom:0}
.part-name{font-weight:600;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);font-weight:600;font-size:15px;padding:8px}
.opt.ok.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.rep.on{background:var(--rep-bg);border-color:var(--rep);color:var(--rep)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{min-height:44px;padding:8px 14px;border-radius:99px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:600}
.cat.on{background:var(--rep);border-color:var(--rep);color:var(--surface);font-weight:600}
.hint{font-size:13px;color:var(--rep);margin:0}
.detail{display:grid;gap:5px}
.detail span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--rep)}
textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;min-height:72px}
.foot{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}
.btn{min-height:46px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.next{width:100%;margin-top:4px}

/* Resumen */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.tile b{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.ok b{color:var(--ok)} .tile.rep b{color:var(--rep)} .tile.fix b{color:var(--prog)}
.catcount{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.catcount div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;gap:1px}
.catcount b{font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums;color:var(--rep)}
.catcount span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;min-height:40px;padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.filters{display:grid;gap:12px}
.res-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.res-top p{margin:0;color:var(--muted);font-size:13px}
.row{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:12px;display:grid;gap:8px}
.row.st-ok{border-left-color:var(--ok)} .row.st-rep{border-left-color:var(--rep)} .row.st-fix{border-left-color:var(--prog)} .row.st-pend{border-left-color:var(--pend)}
.row-h{display:flex;align-items:center;gap:12px}
.row ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.row li{font-size:14px;overflow-wrap:anywhere}
.row li b{font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:99px;background:var(--rep-bg);color:var(--rep);margin:0 4px}
.tag.fix{background:var(--prog-bg);color:var(--prog)} .tag.ok{background:var(--ok-bg);color:var(--ok)}
.sw{font-size:12px;color:var(--muted);margin-right:4px}
.row li.done{color:var(--muted)}
.bdg{position:absolute;top:-7px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--rep);color:var(--bg);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.part-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.av{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-left-width:5px;border-radius:10px;background:var(--surface2)}
.av.st-rep{border-left-color:var(--rep)} .av.st-fix{border-left-color:var(--prog)} .av.st-ok{border-left-color:var(--ok)}
.av-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.av-h .tag{margin:0}
.av-st{font-size:12px;font-weight:600}
.av-st.rep{color:var(--rep)} .av-st.fix{color:var(--prog)} .av-st.ok{color:var(--ok)}
.av-act{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn.go{background:var(--prog-bg);border-color:var(--prog);color:var(--prog)}
.btn.good{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn.danger{background:var(--rep-bg);border-color:var(--rep);color:var(--rep)}
.btn.ghost{background:none;color:var(--muted);font-weight:500}
.btn.add{justify-self:start}
.ask{font-size:13px;color:var(--rep);font-weight:600}
.note{font-size:13px;color:var(--muted);margin:0}
.avsum{margin:10px 0 0;font-size:13px;color:var(--muted)}
.avsum b{color:var(--fg);font-variant-numeric:tabular-nums}
.faltan{font-size:13px;color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.report{display:grid;gap:8px}
.report textarea{min-height:220px;font-family:var(--f-mono);font-size:13px}

/* Barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar-in{max-width:680px;margin-inline:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{min-height:48px;border-radius:10px;border:0;background:var(--surface2);font-weight:600;font-size:15px}
.tab.on{background:var(--accent);color:var(--accent-fg)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;z-index:40;max-width:90vw}
@media (prefers-reduced-motion: reduce){.chev{transition:none}}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}

/* Fotos */
.fotos{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.th{width:64px;height:64px;padding:0;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.ph-n{font-size:12px;color:var(--muted)}
.addph{min-height:46px}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.viewer[hidden]{display:none}
.vw-top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;font-size:14px}
.vw-img{flex:1;min-height:0;display:grid;place-items:center;padding:10px 0}
.vw-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.vw-act{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;color:#fff}
</style><style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.gate{min-height:100vh;display:grid;place-content:center;gap:14px;text-align:center;padding:24px 4px;max-width:360px;margin-inline:auto}
.gate img{width:180px;max-width:70%;margin-inline:auto}
.gate h1{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.1}
.gate h1 span{color:var(--accent)}
.gate p{margin:0;color:var(--muted);font-size:14px}
.gbtn{border:0;border-radius:10px;padding:14px 16px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:16px;min-height:48px}
.glink{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:8px}
.gmsg{color:var(--rep);font-size:14px;min-height:1em}
.salir{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px;padding:10px;display:block;margin:16px auto 0}
</style>
</head>
<body>
<div id="app"><div id="root">
  <header class="top"><div class="top-in" id="top"></div></header>
  <div class="wrap"><div id="notice"></div><main id="main"></main></div>
  <nav class="tabbar" aria-label="Secciones"><div class="tabbar-in" id="tabs"></div></nav>
  <div class="toast" id="toast" hidden></div>
</div>
</div>
<div id="viewer" class="viewer" hidden></div>
<input type="file" id="pick" accept="image/*" hidden>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function(){

function effTheme(){
  var a = document.documentElement.getAttribute("data-theme");
  if(a==="dark"||a==="light") return a;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function toggleTheme(){
  var n = effTheme()==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", n);
  try{ localStorage.setItem(LS_THEME, n); }catch(e){}
}
var COL = "unidades", PCOL = "fotos", MAXF = 3;
var TOWERS = [{n:1,secs:["G","H"]},{n:2,secs:["E","F"]},{n:3,secs:["C","D"]},{n:4,secs:["A","B"]}];
var CATS_ALL = [["ceramica","Cerámica"],["terminaciones","Terminaciones"],["plomeria","Plomería"],["electricidad","Electricidad"],["pintura","Pintura"],["cristaleria","Cristalería"],["puertas","Puertas"],["instalaciones","Instalaciones"],["aparatos","Aparatos sanitarios"],["barandas","Barandas"]];
var CATNAME = {};
CATS_ALL.forEach(function(c){ CATNAME[c[0]] = c[1]; });
var BASE_CATS = ["ceramica","terminaciones","plomeria","electricidad","pintura","cristaleria"];
/* Tipos de avería disponibles por parte */
function catsFor(part){
  var ids = BASE_CATS.slice();
  if(part==="cocina"||part==="pasillo"||part==="escalera") ids = ids.filter(function(x){return x!=="cristaleria";});
  if(part==="escalera") ids = ids.filter(function(x){return x!=="plomeria";});
  if(["sala","hab_principal","hab_secundaria","lavado","bano_principal","bano_secundario","bano_visitas"].indexOf(part)>=0) ids.push("puertas");
  if(part==="cocina") ids.push("instalaciones");
  if(part.indexOf("bano_")===0) ids.push("aparatos");
  if(part==="pasillo"||part==="escalera") ids.push("barandas");
  return ids;
}
var PARTNAME = {sala:"Sala",balcon:"Balcón",hab_principal:"Habitación principal",hab_secundaria:"Habitación secundaria",lavado:"Área de lavado",personalizada:"Área personalizada",bano_principal:"Baño principal",bano_secundario:"Baño secundario",bano_visitas:"Baño de visitas",cocina:"Cocina",pasillo:"Pasillo",escalera:"Escalera"};
var STLABEL = {pend:"Sin revisar",fix:"Por verificar",ok:"Buen estado",rep:"Por reparar"};

function partsFor(kind,floor){
  if(kind==="com") return ["pasillo"];
  if(kind==="esc") return ["escalera"];
  if(floor<=3) return ["sala","balcon","hab_principal","hab_secundaria","lavado","bano_principal","bano_secundario","bano_visitas","cocina"];
  if(floor===4) return ["sala","balcon","hab_principal","hab_secundaria","bano_principal","bano_secundario","bano_visitas","cocina"];
  return ["sala","balcon","lavado","personalizada"];
}

var UNITS = [], BY = {};
TOWERS.forEach(function(t){
  for(var f=1; f<=5; f++){
    t.secs.forEach(function(s){
      ["01","02"].forEach(function(u){
        var code = s+f+u;
        var o = {id:"apt-"+code, code:code, kind:"apt", tower:t.n, floor:f, sec:s, u:u, parts:partsFor("apt",f)};
        UNITS.push(o); BY[o.id]=o;
      });
    });
    var cc = "P"+t.n+"0"+f;
    var c = {id:"com-"+cc, code:cc, kind:"com", tower:t.n, floor:f, parts:partsFor("com",f)};
    UNITS.push(c); BY[c.id]=c;
    if(f<=4){
      var ec = "E"+t.n+"0"+f;
      var e = {id:"esc-"+ec, code:ec, kind:"esc", tower:t.n, floor:f, parts:partsFor("esc",f)};
      UNITS.push(e); BY[e.id]=e;
    }
  }
});

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

/* Modelo: { p:{ parte:{ d:{ tipo:{ t:"texto", s:"rep"|"fix"|"ok" } } } }, rev:true|false }
   rep = por reparar, fix = reparada (falta verificar), ok = terminada bien */
function ensure(id){
  var r = data[id];
  if(!r || Object.isFrozen(r)) r = data[id] = clone(r||{p:{}});
  if(!r.p) r.p = {};
  Object.keys(r.p).forEach(function(k){
    var x = r.p[k]; delete x.e;
    var d = x.d || {};
    Object.keys(d).forEach(function(c){ if(typeof d[c]!=="object" || d[c]===null) d[c] = {t:String(d[c]||""), s:"rep"}; });
    x.d = d;
    if(!Object.keys(d).length) delete r.p[k];
  });
  r.rev = !!r.rev;
  return r;
}
function avs(un,k){
  var r = data[un.id], x = r && r.p && r.p[k], d = (x && x.d) || {}, out = [];
  catsFor(k).forEach(function(c){
    if(c in d){ var v = d[c]; out.push(v && typeof v==="object" ? {cat:c,t:v.t||"",s:v.s||"rep",n:v.n||0} : {cat:c,t:String(v||""),s:"rep",n:0}); }
  });
  return out;
}
var ORD = {rep:0,fix:1,ok:2};
function unitAvs(un){
  var out = [];
  un.parts.forEach(function(k){ avs(un,k).forEach(function(a){ out.push({part:k,cat:a.cat,t:a.t,s:a.s,n:a.n}); }); });
  return out.sort(function(a,b){ return ORD[a.s]-ORD[b.s]; });
}
function isRev(un){ var r = data[un.id]; return !!(r && r.rev); }
function partInfo(un,k){
  var list = avs(un,k), o = 0, f = 0;
  list.forEach(function(a){ if(a.s==="rep") o++; else if(a.s==="fix") f++; });
  var st = o>0 ? "rep" : (f>0 ? "fix" : ((list.length>0 || isRev(un)) ? "ok" : "pend"));
  return {list:list, o:o, f:f, st:st};
}
function info(un){
  var rev = isRev(un), rep = 0, fix = 0, okc = 0, partsOk = 0;
  un.parts.forEach(function(k){
    var p = partInfo(un,k);
    rep += p.o; fix += p.f; okc += p.list.length - p.o - p.f;
    if(p.st==="ok") partsOk++;
  });
  var st = rep>0 ? "rep" : (fix>0 ? "fix" : ((rev && partsOk===un.parts.length) ? "ok" : "pend"));
  return {rev:rev, rep:rep, fix:fix, okc:okc, pend:rep+fix, st:st};
}
function metaTxt(i){
  var s = i.rev ? "Revisión terminada" : "Revisión sin terminar";
  if(i.pend) s += " · "+i.pend+(i.pend===1?" pendiente":" pendientes");
  else if(i.okc) s += " · "+i.okc+(i.okc===1?" terminada":" terminadas");
  return s;
}

function unitLabel(un){
  if(un.kind==="com") return "Área común · Pasillo piso "+un.floor;
  if(un.kind==="esc") return "Escalera entrepiso · Piso "+un.floor;
  var v = un.u==="02" ? "Vista a la piscina" : "Vista contraria a la piscina";
  return v + (un.floor>=4 ? " · Penthouse" : "");
}

function setSync(s,msg){ syncState=s; syncMsg=msg||""; renderTop(); }
function localSave(){ try{ localStorage.setItem(LS_DATA, JSON.stringify(data)); }catch(e){} }
function scheduleSave(id,delay){
  dirty[id]=true; setSync(db?"saving":"local");
  clearTimeout(timers[id]);
  timers[id]=setTimeout(function(){ flush(id); }, delay);
}
function flush(id){
  if(inflight[id]){ again[id]=true; return Promise.resolve(); }
  inflight[id]=true;
  var body = clone(data[id]||{p:{}}); body.t = Date.now();
  var job;
  if(db){ job = db.collection(COL).doc(id).set(body); }
  else { localSave(); job = Promise.resolve(); }
  return job.then(function(){
    inflight[id]=false;
    if(again[id]){ again[id]=false; return flush(id); }
    delete dirty[id];
    if(!Object.keys(dirty).length) setSync(db?"saved":"local");
  }).catch(function(e){
    inflight[id]=false; again[id]=false;
    var m = (e&&(e.code==="invalid_argument"||e.code==="permission-denied")) ? "Tu acceso no permite guardar cambios." : "No se pudo guardar. Revisa la conexión y vuelve a intentar.";
    setSync("error", m);
  });
}

  if(!r.p[k].d[c]) r.p[k].d[c] = {t:"",s:"rep"};
  scheduleSave(id,150);
}
function setAvStatus(id,k,c,s){
  var r = ensure(id), x = r.p[k]; if(!x || !x.d[c]) return;
  x.d[c].s = s; scheduleSave(id,150);
}
function delAv(id,k,c){
  var r = ensure(id), x = r.p[k]; if(!x) return;
  delete x.d[c]; if(!Object.keys(x.d).length) delete r.p[k];
  if(db){ try{ db.collection(PCOL).doc(pid(id,k,c)).delete(); }catch(e){} }
  delete photos[pid(id,k,c)];
  scheduleSave(id,150);
}
function setDetail(id,k,c,t){
  var r = ensure(id), x = r.p[k]; if(!x || !x.d[c]) return;

}

function totals(){
  var t = {pend:0,fix:0,ok:0,rep:0,rev:0,avRep:0,avFix:0,avOk:0};

}
function agg(list){
  var a = {n:list.length, rev:0, pend:0};

}

function syncPhotos(){
  var want = (db && V.tab==="rec") ? V.open : null;
  if(want===photoSubFor) return;
  if(photoSub){ photoSub(); photoSub = null; }
  photoSubFor = want; photos = {};
  if(!want) return;
  photoSub = db.collection(PCOL).where("u","==",want).onSnapshot(function(snap){
    var next = {};
    snap.docs.forEach(function(d){ next[d.id] = d.data(); });
    photos = next;
    if(viewing && !(photos[viewing.pid] && photos[viewing.pid].imgs && photos[viewing.pid].imgs[viewing.i])) closeViewer();
    render();
  }, function(){ toast("No se pudieron leer las fotos"); });
}
function stopPhotos(){ if(photoSub){ photoSub(); photoSub = null; } photoSubFor = null; photos = {}; closeViewer(); }

function compress(file){
  return new Promise(function(res,rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(new Error("lectura")); };
    fr.onload = function(){
      var im = new Image();
      im.onerror = function(){ rej(new Error("imagen")); };
      im.onload = function(){
        var MAXD = 800, MAXB = 60000;
        var w = im.naturalWidth, h = im.naturalHeight, sc = Math.min(1, MAXD/Math.max(w,h));
        var cw = Math.max(1,Math.round(w*sc)), ch = Math.max(1,Math.round(h*sc)), out = "";
        for(var tries=0; tries<6; tries++){
          var cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
          var cx = cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cw,ch); cx.drawImage(im,0,0,cw,ch);
          var q = 0.72;
          out = cv.toDataURL("image/jpeg", q);
          while(out.length*0.75 > MAXB && q > 0.4){ q -= 0.08; out = cv.toDataURL("image/jpeg", q); }
          if(out.length*0.75 <= MAXB) break;
          cw = Math.round(cw*0.85); ch = Math.round(ch*0.85);
        }
        res(out);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function setPhotoCount(id,k,c,n){
  try{ if(document.activeElement && document.activeElement.tagName==="TEXTAREA") document.activeElement.blur(); }catch(e){}
  var r = ensure(id), x = r.p[k]; if(!x || !x.d[c]) return;
  x.d[c].n = n; scheduleSave(id,150);
}
function addPhoto(t,file){
  if(!db) return;
  var key = pid(t.id,t.k,t.c), cur = photos[key], have = cur && cur.imgs ? cur.imgs.length : ((data[t.id]&&data[t.id].p&&data[t.id].p[t.k]&&data[t.id].p[t.k].d[t.c]&&data[t.id].p[t.k].d[t.c].n)||0);
  if(have>=MAXF){ toast("Máximo "+MAXF+" fotos por avería"); return; }
  toast("Procesando foto…");
  compress(file).then(function(url){
    return db.collection(PCOL).doc(key).set({u:t.id, t:Date.now(), imgs:firebase.firestore.FieldValue.arrayUnion(url)},{merge:true}).then(function(){ return have+1; });
  }).then(function(n){
    setPhotoCount(t.id,t.k,t.c,n); toast("Foto guardada");
  }).catch(function(){ toast("No se pudo guardar la foto"); });
}
function removePhoto(vw){
  var ph = photos[vw.pid], src = ph && ph.imgs && ph.imgs[vw.i]; if(!src||!db) return;
  db.collection(PCOL).doc(vw.pid).update({imgs:firebase.firestore.FieldValue.arrayRemove(src)}).then(function(){
    var n = Math.max(0,(ph.imgs.length-1));
    setPhotoCount(vw.id,vw.k,vw.c,n);
  }).catch(function(){ toast("No se pudo eliminar la foto"); });
  closeViewer();
}
function openViewer(id,k,c,i){
  var key = pid(id,k,c), ph = photos[key]; if(!ph||!ph.imgs||!ph.imgs[i]) return;
  viewing = {pid:key,id:id,k:k,c:c,i:i,ask:false}; drawViewer();
}
function closeViewer(){ viewing = null; var v=$("viewer"); if(v){ v.hidden = true; v.innerHTML = ""; } }
function drawViewer(){
  var v = $("viewer"); if(!viewing){ closeViewer(); return; }
  var ph = photos[viewing.pid], src = ph && ph.imgs && ph.imgs[viewing.i]; if(!src){ closeViewer(); return; }
  v.hidden = false;
  v.innerHTML = '<div class="vw-top"><span>'+esc(CATNAME[viewing.c])+' · foto '+(viewing.i+1)+' de '+ph.imgs.length+'</span><button class="btn" data-v="close">Cerrar</button></div>'+
    '<div class="vw-img"><img src="'+src+'" alt="Foto de la avería"></div>'+
    '<div class="vw-act">'+(viewing.ask
      ? '<span class="ask">¿Eliminar esta foto?</span><button class="btn danger" data-v="yes">Sí, eliminar</button><button class="btn" data-v="no">No</button>'
      : '<button class="btn ghost" data-v="del">Eliminar foto</button>')+'</div>';
}
$("viewer").addEventListener("click", function(ev){
  var b = ev.target.closest("[data-v]"); if(!b || !viewing) return;
  var a = b.getAttribute("data-v");
  if(a==="close") closeViewer();
  else if(a==="del"){ viewing.ask = true; drawViewer(); }
  else if(a==="no"){ viewing.ask = false; drawViewer(); }

  else if(act==="tower"){ V.tower=+b.getAttribute("data-n"); V.open=null; V.addFor=null; V.delFor=null; saveView(); }
  else if(act==="floor"){ V.floor=+b.getAttribute("data-f"); V.open=null; V.addFor=null; V.delFor=null; saveView(); }
  else if(act==="toggle"){ V.open = (V.open===id)?null:id; V.addFor=null; V.delFor=null; if(V.open) scrollId=id; }
  else if(act==="addpanel"){ var pk=id+"|"+part; V.addFor = (V.addFor===pk)?null:pk; V.delFor=null; }
  else if(act==="add"){ addAv(id,part,cat); V.addFor=null; focusId="d-"+id+"-"+part+"-"+cat; }
  else if(act==="avs"){ setAvStatus(id,part,cat,b.getAttribute("data-s")); V.delFor=null; }
  else if(act==="del"){ V.delFor=id+"|"+part+"|"+cat; }
  else if(act==="delno"){ V.delFor=null; }
  else if(act==="delyes"){ delAv(id,part,cat); V.delFor=null; }
  else if(act==="rev"){ toggleRev(id); }
  else if(act==="next"){
    if(V.floor<5){ V.floor++; }
    else if(V.tower<4){ V.tower++; V.floor=1; }
    else { V.tab="sum"; }
    V.open=null; V.addFor=null; V.delFor=null; saveView(); window.scrollTo(0,0);
  }
  else if(act==="f"){
    var g=b.getAttribute("data-g"), v=b.getAttribute("data-v");
    if(g==="tw") F.tw=+v; else F[g]=v;
  }
  else if(act==="goto"){
    var un=BY[b.getAttribute("data-id")]; V.tab="rec"; V.tower=un.tower; V.floor=un.floor; V.open=un.id; V.addFor=null; V.delFor=null; saveView(); scrollId=un.id; window.scrollTo(0,0);
  }
  else if(act==="report"){
    reportText = buildReport();
    var done=false;
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(reportText).then(function(){ reportText=""; toast("Reporte copiado"); render(); }, function(){ render(); var r=$("report-text"); if(r){ r.focus(); r.select(); } });
        done=true;
      }
    }catch(e){}
    if(!done){ render(); var r=$("report-text"); if(r){ r.focus(); r.select(); } return; }
    return;
  }
  else if(act==="closereport"){ reportText=""; }
  else if(act==="theme"){ toggleTheme(); }
  else if(act==="photo"){ pickTarget={id:id,k:part,c:cat}; $("pick").value=""; $("pick").click(); return; }
  else if(act==="pv"){ openViewer(id,part,cat,+b.getAttribute("data-i")); return; }
  else return;
  render(); syncPhotos(); afterRender(focusId, scrollId);
});
$("root").addEventListener("input", function(ev){
  var t = ev.target;
  if(t.tagName==="TEXTAREA" && t.getAttribute("data-act")==="detail"){
    var card=t.closest(".unit"); if(!card) return;
    setDetail(card.getAttribute("data-id"), t.getAttribute("data-part"), t.getAttribute("data-cat"), t.value);
  }
});
$("root").addEventListener("focusout", function(ev){
  if(ev.target.tagName==="TEXTAREA" && ev.target.getAttribute("data-act")==="detail"){
    setTimeout(function(){ if(!typing()) render(); }, 120);
  }
});

/* ---------- Datos ---------- */
function onSnap(snap){
  var next = {};
  snap.docs.forEach(function(d){ next[d.id] = d.data(); });
  Object.keys(dirty).forEach(function(id){ if(data[id]) next[id] = data[id]; });
  data = next;
  if(syncState==="connecting") setSync(Object.keys(dirty).length?"saving":"saved");
  if(typing()) renderTop(); else render();
}
render();
